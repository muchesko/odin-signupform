<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="globals.css">
</head>

<body>
    <div class="main">

        <div class="column-1">
            <img src="image.jpg">
            <div class="banner">
                <p style="font-size: 96px; color: white">ODIN</p>
            </div>
            <div class="attribution">
                <p>Photo by Nate Rayfield on <a href="https://unsplash.com/photos/green-leafed-tree-on-body-of-water-under-starry-sky-_WR6tUIAJe8">Unsplash</a></p>
            </div>
        </div>

        <div class="column-2">

            <div class="row row-1">
                <div class="content">
                    <p style="font-size: 24px; font-weight: 800">This is not a real online service! You know you need
                        something like this in your life to help you realize your deepest dreams. Sign up <span
                            style="font-style: italic">now </span>to get started.</p>
                    <p style="font-size: 24px; font-weight: 800">You <span style="font-style: italic">know </span>you
                        want to.</p>
                </div>
            </div>


            <form>
                <div class="row row-2">
                    <div class="content">
                        <p style="font-size: 20px; font-weight: 800">Let's do this!</p>
                        <div class="form">
                            <div class="form-row-1">
                                <div class="field form-firstname">
                                    <label for="firstname">First Name *</label>
                                    <input type="text" id="firstname" name="form-firstname" required>
                                </div>
                                <div class="field form-lastname">
                                    <label for="form-lastname">Last Name *</label>
                                    <input type="text" id="form-lastname" name="form-lastname" required>
                                </div>
                            </div>
                            <div class="form-row-2">
                                <div class="field form-email">
                                    <label for="email">Email *</label>
                                    <input type="email" id="form-email" name="form-email" required>
                                </div>
                                <div class="field form-phonenumber">
                                    <label for="form-phonenumber">Phone Number *</label>
                                    <input type="tel" id="form-phonenumber" name="form-phonenumber" required>
                                </div>
                            </div>
                            <div class="form-row-3">
                                <div class="field form-password">
                                    <label for="form-password">Password *</label>
                                    <input type="password" id="form-password" name="form-password" required>
                                </div>
                                <div class="field form-confirmpassword">
                                    <label for="form-confirmpassword">Confirm Password *</label>
                                    <input type="password" id="form-confirmpassword" name="form-confirmpassword"
                                        required>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row row-3">
                    <div class="content">
                        <button id="create-account">
                            Create Account
                        </button>
                        <p>Already have an account?<span id="sign-in">Sign in</span></p>
                    </div>
                </div>

            </form>
        </div>
</body>

</html>
